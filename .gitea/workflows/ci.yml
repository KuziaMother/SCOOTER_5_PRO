name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (E9, F — реальные ошибки, не стиль)
        run: python -m ruff check .

      - name: Compile check (py_compile всех .py)
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir(".", quiet=1, rx=__import__("re").compile(r"[\\/](zip_archives|\.git)[\\/]"))
          sys.exit(0 if ok else 1)
          PY

      - name: pytest
        run: python -m pytest tests/ -v
