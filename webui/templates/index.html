<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scooter 5 Pro — панель</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  // Синхронно, до отрисовки — иначе будет вспышка не той темы при перезагрузке.
  (function () {
    try {
      var t = localStorage.getItem("scooter_theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="corner-actions">
  <button id="pin-toggle" class="pin-toggle" type="button" title="PIN для разблокировки">🔑</button>
  <button id="theme-toggle" class="theme-toggle" type="button" title="Светлая/тёмная тема">🌙</button>
</div>

<header class="topbar">
  <h1>Scooter 5 Pro</h1>
  <span id="badge" class="badge idle">idle</span>
  <div class="topbar-actions">
    <span id="conn" class="conn">—</span>
    <button id="scooter-toggle" class="scooter-toggle" type="button" title="Мои самокаты — выбор устройства для подключения">📡 —</button>
    <button id="ridemode-toggle" class="ridemode-toggle" type="button" title="Режим езды — крупные цифры для руля">🏍️</button>
    <button id="write-toggle" class="write-toggle" type="button" title="Разрешить управление настройками (SET)">🔒 Только чтение</button>
    <a href="/service" class="scooter-toggle" style="text-decoration:none;" title="Сервис — прошивка">🔧 Сервис</a>
  </div>
</header>

<section class="panel controls">
  <label>
    Режим
    <select id="mode">
      <option value="poll" selected>poll</option>
      <option value="once">once</option>
      <option value="push">push</option>
    </select>
  </label>
  <label>
    Интервал, с
    <input id="interval" type="number" min="1" max="60" step="0.5" value="3">
  </label>
  <label>
    Static-интервал, с
    <input id="static_interval" type="number" min="10" max="600" step="5" value="60">
  </label>
  <button id="start">Старт</button>
  <button id="stop" disabled>Стоп</button>
  <span class="spacer"></span>
  <span class="stat">режим: <b id="mode-val">—</b></span>
  <span class="stat">пуши: <b id="pushes">0</b></span>
  <span class="stat">rx: <span id="rx">∅</span></span>
  <span class="stat">обновлено: <b id="updated">—</b></span>
</section>
<div id="msg" class="msg"></div>

<section id="hero" class="hero" hidden></section>

<main>
  <div id="groups" class="groups"></div>

  <section class="panel">
    <h2 data-icon="📜">История (раунды) <span id="histcount" class="dim"></span></h2>
    <div id="history" class="log"></div>
  </section>

  <section class="panel">
    <h2 data-icon="🛰️">События</h2>
    <div id="events" class="log"></div>
  </section>
</main>

<footer class="dim">
  Только чтение · bind 127.0.0.1 · секреты (OOB_CODE/SN) скрыты
</footer>

<section id="ridemode" class="ridemode" hidden>
  <div id="rm-fault-banner" class="rm-fault-banner" hidden></div>
  <div class="rm-topbar">
    <button id="ridemode-exit" class="rm-exit" type="button" aria-label="Выйти из режима езды">✕</button>
    <div id="rm-chips" class="rm-chips"></div>
  </div>
  <div class="rm-body">
    <aside class="rm-sidebar">
      <div class="rm-side-stat"><span class="rm-stat-label">Пробег</span><span id="rm-trip-dist" class="rm-stat-value">—</span></div>
      <div class="rm-side-stat"><span class="rm-stat-label">Время в пути</span><span id="rm-trip-time" class="rm-stat-value">—</span></div>
    </aside>
    <div class="rm-main">
      <div id="rm-mode" class="rm-mode" hidden></div>
      <div class="rm-speed"><span id="rm-speed-val">—</span><span class="rm-speed-unit">км/ч</span></div>
    </div>
  </div>
  <div class="rm-footer">
    <div class="rm-stat"><span class="rm-stat-label">Заряд</span><span id="rm-battery" class="rm-stat-value">—</span></div>
    <div class="rm-stat"><span class="rm-stat-label">Запас хода</span><span id="rm-range" class="rm-stat-value">—</span></div>
  </div>
</section>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-msg" class="modal-msg"></div>
    <input id="modal-input" class="modal-input" type="password" inputmode="numeric" autocomplete="off" hidden>
    <div class="modal-actions">
      <button id="modal-cancel" type="button" class="modal-btn modal-cancel">Отмена</button>
      <button id="modal-ok" type="button" class="modal-btn modal-ok">Подтвердить</button>
    </div>
  </div>
</div>

<div id="scooters-overlay" class="modal-overlay" hidden>
  <div class="modal scooters-modal">
    <div class="modal-title">Мои самокаты</div>
    <div id="scooters-list" class="scooters-list"></div>
    <div id="scooters-scan-results" class="scooters-list" hidden></div>
    <div class="modal-actions scooters-modal-actions">
      <div class="scooters-add-actions">
        <button id="scooters-scan-btn" type="button" class="modal-btn">🔍 Сканировать</button>
        <button id="scooters-add" type="button" class="modal-btn">+ Вручную</button>
      </div>
      <button id="scooters-close" type="button" class="modal-btn modal-ok">Готово</button>
    </div>
  </div>
</div>

<div id="ltmk-overlay" class="modal-overlay" hidden>
  <div class="modal ltmk-modal">
    <div class="modal-title">Получить LTMK</div>
    <div id="ltmk-body"></div>
    <div class="modal-actions">
      <button id="ltmk-close" type="button" class="modal-btn modal-ok">Закрыть</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
